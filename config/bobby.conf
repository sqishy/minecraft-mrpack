# Bobby (ReNeoForged) config shipped by the Cobblemon Rally pack.
# Bobby caches chunks the server has already sent and re-renders them locally
# beyond the server's view-distance, so revisited areas (e.g. a race circuit you
# lap) don't have to reload from the server. See the Bobby entry in extra_mods.py.

enabled=true
dynamicMultiWorld=false
noBlockEntities=true
taintFakeChunks=false

# Seconds a chunk stays loaded/rendered after it leaves your view distance before
# Bobby unloads it. Raised from the default 60 so a full circuit lap (which can
# exceed 60s) finishes before the chunks behind you unload -- you come back around
# to already-rendered terrain instead of a reload. Costs some RAM (more chunks held
# meshed); fine for a bounded track. Lower it if low-memory clients struggle.
unloadDelaySecs=180

# -1 = never auto-delete cached regions (Bobby's default). Keeps a lapped track
# cached across sessions.
deleteUnusedRegionsAfterDays=-1

# Raises the render-distance slider cap (needs Sodium, which the pack ships). Left
# at Bobby's default 32.
maxRenderDistance=32

# Singleplayer-only integrated-server view-distance override; 0 = disabled. This
# pack is multiplayer, so this does nothing here -- left off.
viewDistanceOverwrite=0
